project:
  type: book

execute:
  # `auto` reejecuta solo los capítulos que cambian y guarda el resultado en
  # _freeze/. Evita que una caída de las APIs externas tumbe la publicación.
  freeze: auto

# Todos los capítulos usan el entorno fijado en Project.toml/Manifest.toml.
# `@.` busca el Project.toml en el directorio actual o en sus padres, así que
# funciona igual para los .qmd de la raíz que para los de parts/.
julia:
  exeflags: ["--project=@."]

book:
  title: "Ciencia de datos con Julia"
  author: "Iraitz Montalbán"
  description: "Tutoriales y guías de ciencia de datos utilizando el lenguaje Julia."
  date: today
  cover-image: images/cover.png
  favicon: images/cover.png
  site-url: https://iraitzm.github.io/ciencia-datos-julia
  repo-url: https://github.com/IraitzM/ciencia-datos-julia
  page-navigation: true
  search: true
  sharing: [linkedin]
  sidebar:
    collapse-level: 1
    content: auto
    pinned: false
    style: docked
    background: light
  page-footer: 
    left: "Copyright 2025, Iraitz Montalbán" 
    right: 
      - icon: github
        href: https://github.com/IraitzM
      - icon: linkedin 
        href: https://www.linkedin.com/in/iraitzmontalban/
    border: false
    background: light
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Primeros pasos"
      chapters:
      - parts/firststeps/basics.qmd
      - parts/firststeps/flujos.md
      - parts/firststeps/librerias.qmd
      - parts/firststeps/sistemaficheros.qmd

    - part: "Carga y exploración"
      chapters:
      - parts/dataframes/basics.qmd
      - parts/dataframes/summary.qmd
      - parts/dataframes/exploratory.qmd

    - part: "Preparación de datos"
      chapters:
      - parts/preparacion/particion.qmd
      - parts/preparacion/codificacion.qmd
      - parts/preparacion/pipelines.qmd

    - part: "Puesta en producción"
      chapters:
      - parts/produccion/despliegue.qmd
      - parts/produccion/monitorizacion.qmd
      - parts/produccion/mlops.qmd

    - references.qmd

bibliography: references.bib

format:
  html:
    include-in-header: static/code_head.html
    include-before-body: static/code_body.html
    number-depth: 3
    theme: 
     - cosmo
     - style.scss
    code-link: true

# Some SEO
metadata:
  lang: es
  author: "Iraitz Montalbán"
  twitter-card: false
  open-graph: true
  image: images/cover.png

resources:
  - robots.txt



